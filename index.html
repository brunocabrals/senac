    <style>
        body {
            background-color: #080808;

        header {

            border-bottom: 2px solid #168cff;
            padding: 20px;
            text-align: center;
        }

        h1, h2 {
            font-family: Impact, sans-serif;
            letter-spacing: 2px;
        }

        h1 {

            font-size: 45px;
        }

        nav a {

        }

        .botao {
        background-color: #168cff;
        color: white;
        padding: 12px 20px;
        border-radius: 10px;
        text-decoration: none;
        display: inline-block;
        margin-top: 10px;
       
        }
        .assinatura {
            font-family: "Brush Script MT", cursive;
            font-size: 150px !important;
            color: #168cff;
            text-align: center;
            margin-top: 20px;
            transform: rotate(-5deg);
        }

        footer {
            background-color: #111;
            text-align: center;
            padding: 20px;
            background: linear-gradient(90deg, #0A192F,#112D4E, #2563eb);;
        }
         /* Ajuste para celulares */
        @media (max-width: 600px) {
            nav a {
                display: inline-block;
                margin: 8px;
            }

            .inicio h2 {
                font-size: 26px;
            }

            .card {
                width: 100%;
                max-width: 320px;
            }

</head>
